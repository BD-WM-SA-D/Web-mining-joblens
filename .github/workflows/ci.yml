name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # gồm test hợp đồng mining-service (tests/test_mining_service.py); không cần data/
      - run: uv run pytest -q
